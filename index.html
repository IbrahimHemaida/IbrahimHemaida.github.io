<style>
/* Layout: one left-aligned column on a 1120px measure. Each section is a two-track row:
   a narrow sticky label on the left, content on the right. Numbers are set in the display face. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#101827; --muted:#566074; --line:#D9DEE6;
  --accent:#1746D1; --accent-ink:#FFFFFF; --tint:#E6ECFB; --ok:#0E7A4F;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C111B; --surface:#141B29; --ink:#EEF1F6; --muted:#9AA5B8; --line:#263044;
  --accent:#8AAEFF; --accent-ink:#0C111B; --tint:#1A2540; --ok:#4FD39A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0C111B; --surface:#141B29; --ink:#EEF1F6; --muted:#9AA5B8; --line:#263044;
  --accent:#8AAEFF; --accent-ink:#0C111B; --tint:#1A2540; --ok:#4FD39A; color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:20px;height:56px}
.mark{font:700 1.05rem/1 var(--display);text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{font:500 .8rem/1 var(--mono);text-decoration:none;color:var(--muted);padding:9px 10px;border-radius:6px;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--tint)}
.theme{flex:none;width:34px;height:34px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.theme svg{width:16px;height:16px}

/* hero */
.hero{padding-block:clamp(48px,9vw,104px) clamp(36px,6vw,64px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,5vw,64px);align-items:end}
.eyebrow{font:500 .82rem/1.4 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:0 0 18px}
h1{font:800 clamp(2.9rem,10.5vw,7.4rem)/.92 var(--display);letter-spacing:-.045em;margin:0;text-wrap:balance}
h1 span{display:block}
h1 span:last-child{color:var(--accent)}
.lede{font-size:clamp(1.1rem,2vw,1.4rem);line-height:1.45;max-width:34ch;margin:28px 0 0;text-wrap:pretty}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font:400 .85rem/1.4 var(--mono);color:var(--muted)}
.avail{color:var(--ok);display:inline-flex;align-items:center;gap:8px}
.avail::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.btn{font:600 .92rem/1 var(--body);text-decoration:none;padding:13px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);transition:transform .15s,border-color .15s}
.btn:hover{transform:translateY(-1px);border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.photo{width:clamp(140px,22vw,250px);aspect-ratio:4/5;object-fit:cover;border-radius:14px;border:1px solid var(--line)}

/* sections */
.sec{border-top:1px solid var(--line);padding-block:clamp(40px,6vw,72px)}
.sec-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px clamp(24px,5vw,64px)}
.sec h2{font:700 1.05rem/1.3 var(--display);letter-spacing:-.01em;margin:0;position:sticky;top:80px;align-self:start}
.prose p{margin:0 0 1em;max-width:62ch;font-size:1.08rem}
.prose p:last-child{margin-bottom:0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:28px 24px}
.stat b{display:block;font:800 clamp(2.4rem,5vw,3.6rem)/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:10px;color:var(--muted);font-size:.95rem;max-width:22ch;line-height:1.4}

/* timeline */
.tl{display:grid;gap:36px}
.job{display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px 24px}
.job time{font:500 .82rem/1.7 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.job h3{font:700 1.2rem/1.3 var(--display);margin:0;letter-spacing:-.01em}
.job .org{color:var(--muted);font-size:.95rem;margin:2px 0 10px}
.job .org b{color:var(--accent);font-weight:600}
.job ul{margin:0;padding-left:18px;display:grid;gap:6px;max-width:66ch}
.job li::marker{color:var(--line)}

/* projects */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.shot{aspect-ratio:16/10;background:var(--tint);position:relative;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;gap:4%;padding:7% 7% 0;border:0;width:100%;font:inherit}
button.shot{cursor:zoom-in}
.shot img{width:29%;flex:none;border-radius:10px 10px 0 0;border:1px solid var(--line);border-bottom:0;box-shadow:0 10px 30px rgb(16 24 39 / .16)}
.shot img:nth-child(2){margin-top:5%}
.shot .mono{position:absolute;left:18px;bottom:6px;font:800 clamp(4rem,9vw,5.6rem)/1 var(--display);letter-spacing:-.06em;color:var(--accent);opacity:.9}
.shot .metric{position:absolute;right:12px;bottom:12px;font:500 .75rem/1 var(--mono);background:var(--surface);color:var(--ink);padding:7px 9px;border-radius:6px;border:1px solid var(--line)}
.card-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font:700 1.25rem/1.25 var(--display);margin:0;letter-spacing:-.015em;overflow-wrap:anywhere}
.card .tag{color:var(--accent);font-weight:500;font-size:.95rem;margin:0}
.card p.desc{margin:0;color:var(--muted);font-size:.95rem;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font:400 .74rem/1 var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.card-links{display:flex;flex-wrap:wrap;gap:14px;margin-top:auto;padding-top:10px}
.card-links a,.rows a{font-weight:600;font-size:.92rem;text-decoration-color:var(--accent);text-underline-offset:4px}
.card-links a::after{content:" ↗";font-family:var(--mono);color:var(--accent)}

/* screenshot viewer */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:14px;max-width:min(96vw,1100px);width:max-content}
dialog::backdrop{background:rgb(8 12 20 / .72)}
.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line)}
.viewer-head b{font:700 1.05rem/1.2 var(--display)}
.viewer-head button{font:600 .85rem/1 var(--body);padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.viewer{display:flex;gap:14px;overflow-x:auto;padding:18px}
.viewer img{height:min(72vh,640px);width:auto;max-width:none;border-radius:10px;border:1px solid var(--line)}

/* skills */
.skills{display:grid;gap:22px}
.skill{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 20px;align-items:start}
.skill h3{font:500 .82rem/1.9 var(--mono);color:var(--muted);margin:0;text-transform:uppercase;letter-spacing:.04em}
.skill .chips{margin:0}
.skill .chip{color:var(--ink);background:var(--surface);font-size:.8rem;padding:7px 10px}

/* rows */
.rows{display:grid}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 24px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:first-child{padding-top:0}
.row:last-child{border-bottom:0;padding-bottom:0}
.row b{font-weight:600}
.row span{color:var(--muted)}

/* footer */
.foot{border-top:1px solid var(--line);padding-block:clamp(48px,8vw,96px)}
.foot h2{font:800 clamp(2rem,6vw,4rem)/1 var(--display);letter-spacing:-.04em;margin:0 0 20px;text-wrap:balance}
.mail{font:500 clamp(1rem,2.4vw,1.5rem)/1.3 var(--mono);color:var(--accent);text-underline-offset:6px;overflow-wrap:anywhere}
.foot .cta{margin-top:26px}
.fine{margin-top:44px;font:400 .78rem/1.5 var(--mono);color:var(--muted)}
.state{padding:120px 0;font:400 .9rem/1.5 var(--mono);color:var(--muted)}

@media (max-width:760px){
  .hero-grid{grid-template-columns:1fr;align-items:start}
  .photo{order:-1;width:120px}
  .sec-grid{grid-template-columns:1fr}
  .sec h2{position:static;font-size:.82rem;font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .job,.skill{grid-template-columns:1fr}
  .mark{display:none}
  .nav{margin-left:0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="mark" href="#top" id="mark"></a>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <button class="theme" id="theme" type="button" aria-label="Switch between light and dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
  </button>
</div></header>
<dialog id="viewer"><div class="viewer-head"><b id="viewer-name"></b><button type="button" id="viewer-close">Close</button></div><div class="viewer" id="viewer-body"></div></dialog>
<main id="top"><div class="wrap"><p class="state" id="state">Loading…</p></div></main>

<script>
(function(){
  var root=document.documentElement;
  try{var t=localStorage.getItem('pf_theme');if(t)root.setAttribute('data-theme',t);}catch(e){}
  document.getElementById('theme').addEventListener('click',function(){
    var dark=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
    var next=dark?'light':'dark';root.setAttribute('data-theme',next);
    try{localStorage.setItem('pf_theme',next);}catch(e){}
  });

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function url(u){u=String(u||'').trim();return /^(https?:\/\/|mailto:|\.{0,2}\/|assets\/|#)/i.test(u)?esc(u):'';}
  function ext(u){return /^https?:/i.test(u)?' target="_blank" rel="noopener"':'';}
  function arr(a){return Array.isArray(a)?a:[];}
  function chips(a){return arr(a).length?'<div class="chips">'+arr(a).map(function(t){return'<span class="chip">'+esc(t)+'</span>';}).join('')+'</div>':'';}
  function initials(n){var w=String(n||'').replace(/[^A-Za-z0-9 ]/g,' ').trim().split(/\s+/);return esc(((w[0]||'')[0]||'')+((w[1]||'')[0]||(w[0]||'')[1]||'')).toUpperCase();}

  var R={
    stats:function(s){return'<div class="stats">'+arr(s.items).map(function(i){return'<div class="stat"><b>'+esc(i.value)+'</b><span>'+esc(i.label)+'</span></div>';}).join('')+'</div>';},
    text:function(s){return'<div class="prose">'+String(s.body||'').split(/\n\s*\n/).map(function(p){return'<p>'+esc(p.trim())+'</p>';}).join('')+'</div>';},
    timeline:function(s){return'<div class="tl">'+arr(s.items).map(function(i){
      return'<article class="job"><time>'+esc(i.period)+'</time><div><h3>'+esc(i.role)+'</h3><p class="org"><b>'+esc(i.org)+'</b>'+(i.location?' · '+esc(i.location):'')+'</p>'+
        (arr(i.bullets).length?'<ul>'+arr(i.bullets).map(function(b){return'<li>'+esc(b)+'</li>';}).join('')+'</ul>':'')+'</div></article>';}).join('')+'</div>';},
    projects:function(s){return'<div class="cards">'+arr(s.items).map(function(i){
      var imgs=arr(i.images).concat(i.image?[i.image]:[]).map(url).filter(Boolean), tag=imgs.length?'button':'div';
      return'<article class="card"><'+tag+' class="shot"'+(imgs.length?' type="button" data-shots="'+esc(imgs.join('|'))+'" data-name="'+esc(i.name)+'" aria-label="Open '+esc(i.name)+' screenshots"':'')+'>'+
        (imgs.length?imgs.slice(0,3).map(function(u){return'<img src="'+u+'" alt="" loading="lazy">';}).join(''):'<span class="mono" aria-hidden="true">'+initials(i.name)+'</span>')+
        (i.metric?'<span class="metric">'+esc(i.metric)+'</span>':'')+'</'+tag+'><div class="card-body"><h3>'+esc(i.name)+'</h3>'+
        (i.tagline?'<p class="tag">'+esc(i.tagline)+'</p>':'')+(i.description?'<p class="desc">'+esc(i.description)+'</p>':'')+chips(i.tags)+
        (arr(i.links).filter(function(l){return url(l.url);}).length?'<div class="card-links">'+arr(i.links).filter(function(l){return url(l.url);}).map(function(l){return'<a href="'+url(l.url)+'"'+ext(l.url)+'>'+esc(l.label||'Open')+'</a>';}).join('')+'</div>':'')+
        '</div></article>';}).join('')+'</div>';},
    skills:function(s){return'<div class="skills">'+arr(s.items).map(function(i){return'<div class="skill"><h3>'+esc(i.group)+'</h3>'+chips(i.tags)+'</div>';}).join('')+'</div>';},
    links:function(s){return'<div class="rows">'+arr(s.items).map(function(i){var u=url(i.url);
      return'<div class="row">'+(u?'<a href="'+u+'"'+ext(i.url)+'><b>'+esc(i.label)+'</b></a>':'<b>'+esc(i.label)+'</b>')+(i.note?'<span>'+esc(i.note)+'</span>':'')+'</div>';}).join('')+'</div>';}
  };

  function render(d){
    var p=d.profile||{}, secs=arr(d.sections).filter(function(s){return s.visible!==false&&R[s.type];});
    document.title=(d.site&&d.site.title)||p.name||'Portfolio';
    document.getElementById('mark').textContent=p.name||'';
    document.getElementById('nav').innerHTML=secs.map(function(s){return'<a href="#'+esc(s.id)+'">'+esc(s.title)+'</a>';}).join('')+'<a href="#contact">Contact</a>';
    var name=String(p.name||'').trim().split(/\s+/), first=name.slice(0,-1).join(' ')||name[0]||'', last=name.length>1?name[name.length-1]:'';
    var mail=p.email?'mailto:'+p.email:'', cv=url(p.resumeUrl), photo=url(p.photo);
    var links=arr(p.links).filter(function(l){return url(l.url);}).map(function(l){return'<a class="btn" href="'+url(l.url)+'"'+ext(l.url)+'>'+esc(l.label)+'</a>';}).join('');
    var cta=(mail?'<a class="btn primary" href="'+esc(mail)+'">Email me</a>':'')+(cv?'<a class="btn" href="'+cv+'"'+ext(p.resumeUrl)+'>Résumé</a>':'')+links;
    var h='<div class="wrap"><section class="hero"><div class="hero-grid"><div>'+
      '<p class="eyebrow">'+esc(p.role)+'</p><h1><span>'+esc(first)+'</span>'+(last?'<span>'+esc(last)+'</span>':'')+'</h1>'+
      '<p class="lede">'+esc(p.headline)+'</p><div class="meta">'+(p.availability?'<span class="avail">'+esc(p.availability)+'</span>':'')+(p.location?'<span>'+esc(p.location)+'</span>':'')+'</div>'+
      '<div class="cta">'+cta+'</div></div>'+(photo?'<img class="photo" src="'+photo+'" alt="'+esc(p.name)+'">':'')+'</div></section>';
    secs.forEach(function(s){h+='<section class="sec" id="'+esc(s.id)+'"><div class="sec-grid"><h2>'+esc(s.title)+'</h2><div>'+R[s.type](s)+'</div></div></section>';});
    h+='<footer class="foot" id="contact"><h2>Let’s build something people use.</h2>'+(p.email?'<a class="mail" href="'+esc(mail)+'">'+esc(p.email)+'</a>':'')+
      '<div class="cta">'+(cv?'<a class="btn" href="'+cv+'"'+ext(p.resumeUrl)+'>Résumé</a>':'')+links+'</div>'+
      '<p class="fine">'+esc(p.name)+(p.location?' · '+esc(p.location):'')+' · '+new Date().getFullYear()+'</p></footer></div>';
    document.querySelector('main').innerHTML=h;
  }

  var dlg=document.getElementById('viewer');
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-shots]');
    if(b){document.getElementById('viewer-name').textContent=b.getAttribute('data-name');
      document.getElementById('viewer-body').innerHTML=b.getAttribute('data-shots').split('|').map(function(u){return'<img src="'+esc(u)+'" alt="'+esc(b.getAttribute('data-name'))+' screenshot">';}).join('');
      dlg.showModal();}
    else if(e.target===dlg||e.target.id==='viewer-close')dlg.close();
  });

  var draft=null;
  if(/[?&]preview=1/.test(location.search)){try{draft=JSON.parse(localStorage.getItem('pf_draft'));}catch(e){}}
  if(draft){render(draft);return;}
  fetch('content.json?v='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();}).then(render).catch(function(){
    document.getElementById('state').textContent='Could not load content.json. Check that the file sits next to index.html.';
  });
})();
</script>
